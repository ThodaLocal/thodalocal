<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Store — ThodaLocal Admin</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
--off: #f7f5f0;
--black: #111110;
--green: #1e5c3a;
--green2: #2d7a52;
--green3: #e8f4ee;
--gold: #c17f24;
--muted: #888;
--muted2: #555;
--border: #e8e4dc;
--border2: #d4cfc6;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'DM Sans', sans-serif; background: var(--off); color: var(--black); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.card { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 36px 28px; max-width: 440px; width: 100%; }
h1 { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; margin-bottom: 4px; }
.sub { font-size: 13px; color: var(--muted); margin-bottom: 28px; }
label { display: block; font-size: 12px; font-weight: 600; color: var(--muted2); margin-bottom: 6px; margin-top: 16px; }
label:first-of-type { margin-top: 0; }
input, select, textarea { width: 100%; padding: 12px 14px; font-size: 14px; font-family: 'DM Sans', sans-serif; border: 1px solid var(--border2); border-radius: 6px; background: var(--off); color: var(--black); outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--green); background: #fff; }
textarea { resize: vertical; min-height: 70px; }
button { width: 100%; margin-top: 24px; background: var(--green); color: #fff; border: none; padding: 15px; font-size: 14px; font-weight: 700; font-family: 'Syne', sans-serif; border-radius: 6px; cursor: pointer; }
button:hover { background: var(--green2); }
button:disabled { opacity: 0.6; }
.msg { margin-top: 16px; padding: 12px 14px; border-radius: 6px; font-size: 13px; display: none; }
.msg.ok { background: var(--green3); color: var(--green); display: block; }
.msg.err { background: #fdeaea; color: #b3261e; display: block; }
.passcode-row { background: var(--off); border: 1px dashed var(--border2); border-radius: 6px; padding: 14px; margin-bottom: 4px; }
</style>
</head>
<body>
<div class="card">
<h1>Add Verified Store</h1>
<div class="sub">Internal use only — for stores you've personally hygiene-checked.</div>

<form id="storeForm">
<div class="passcode-row">
<label style="margin-top:0;">Admin Passcode</label>
<input type="password" id="passcode" required />
</div>

<label>Store Name</label>
<input type="text" id="name" required />

<label>Category</label>
<select id="category" required>
<option value="Kirana">Kirana</option>
<option value="Vegetables & Fruits">Vegetables & Fruits</option>
<option value="Sweets & Bakery">Sweets & Bakery</option>
<option value="Salon & Grooming">Salon & Grooming</option>
<option value="Dairy">Dairy</option>
<option value="Other">Other</option>
</select>

<label>Area / Locality</label>
<input type="text" id="area" placeholder="e.g. Sector 14, Gurugram" required />

<label>Hygiene Status</label>
<select id="hygiene" required>
<option value="yes">Verified</option>
<option value="pending">Pending</option>
</select>

<label>Short Description</label>
<textarea id="description" placeholder="One or two lines about the store"></textarea>

<label>Phone Number</label>
<input type="tel" id="phone" placeholder="10-digit number" />

<button type="submit" id="submitBtn">Add Store</button>
<div class="msg" id="msg"></div>
</form>
</div>

<script>
const SHEET_API = 'https://script.google.com/macros/s/AKfycbweyWvWL5cxgaLh1zc8m9YgaWsUowlUxnCQrm4fBWiDSJ5UurfQxOMRSa45z7LaRlFR/exec';

document.getElementById('storeForm').addEventListener('submit', async function(e) {
e.preventDefault();
const btn = document.getElementById('submitBtn');
const msg = document.getElementById('msg');
msg.className = 'msg';
msg.style.display = 'none';

const payload = {
action: 'addStore',
passcode: document.getElementById('passcode').value,
name: document.getElementById('name').value,
category: document.getElementById('category').value,
area: document.getElementById('area').value,
hygiene: document.getElementById('hygiene').value,
description: document.getElementById('description').value,
phone: document.getElementById('phone').value
};

btn.disabled = true;
btn.textContent = 'Adding...';

try {
const res = await fetch(SHEET_API, {
method: 'POST',
headers: { 'Content-Type': 'text/plain;charset=utf-8' },
body: JSON.stringify(payload)
});
const data = await res.json();

if (data.status === 'success') {
msg.textContent = '✅ Store added — it will now appear on the live Browse Stores page.';
msg.classList.add('ok');
document.getElementById('storeForm').reset();
} else if (data.error === 'unauthorized') {
msg.textContent = '❌ Wrong passcode.';
msg.classList.add('err');
} else {
msg.textContent = '❌ Something went wrong. Try again.';
msg.classList.add('err');
}
} catch (err) {
msg.textContent = '❌ Network error. Check your connection and try again.';
msg.classList.add('err');
}

btn.disabled = false;
btn.textContent = 'Add Store';
});
</script>
</body>
</html>
